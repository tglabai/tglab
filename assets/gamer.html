<!DOCTYPE html>
<html lang="en" ng-app="techGroupApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechGroup | Gamer Products</title>
  <link rel="stylesheet" href="/project-folder/assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body ng-controller="GamerController">
  <header>
    <h1>Top Gamer Products 2025</h1>
    <p>Elite tech for next-gen gamers</p>
  </header>

  <nav>
    <a href="/project-folder/index.html">Home</a>
    <a href="gamer.html">Gamer</a>
    <a href="products.html">Products</a>
  </nav>


  <main>
    <section class="product-grid">
      <div class="product-card" ng-repeat="product in allProducts">
        <a ng-href="{{ product.link }}" target="_blank">
          <img ng-src="{{ product.image }}" alt="{{ product.name }}">
          <h2>{{ product.name }}</h2>
          <p class="teaser">Discover performance, power, and precision in one product. Click to learn more!</p>
        </a>
        <button class="add-to-cart" ng-click="addToCart(product)">Add to Cart</button>
      </div>
    </section>
  </main>

  <div class="cart" ng-click="toggleCart()">
    <span class="cart-count" ng-if="cart.length > 0">{{ cart.length }}</span>
    <i class="fas fa-shopping-cart"></i>
  </div>

  <div ng-show="isCartVisible" class="cart-modal">
    <div class="cart-items">
      <ul>
        <li ng-repeat="item in cart">
          {{ item.name }} 
          <button class="remove-item" ng-click="removeFromCart(item)">Remove</button>
        </li>
      </ul>
    </div>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2025 TechGroup. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script>
    const app = angular.module("techGroupApp", []);
    app.controller("ProductsController", function ($scope) {
      const defaultImage = "https://via.placeholder.com/250x150?text=Product+Image";
      $scope.allProducts = [
        // Replace this array with real data if needed
        { name: "PlayStation 5", image: defaultImage, link: "#" },
        { name: "Razer Blade 16 Laptop", image: defaultImage, link: "#" },
        { name: "Elgato Stream Deck", image: defaultImage, link: "#" },
      ];

      $scope.cart = [];
      $scope.isCartVisible = false;
      
      $scope.addToCart = function(product) {
        $scope.cart.push(product);
      };   $scope.removeFromCart = function(item) {
        const index = $scope.cart.indexOf(item);
        if (index !== -1) {
          $scope.cart.splice(index, 1);
        }
      };
      
      $scope.toggleCart = function() {
        $scope.isCartVisible = !$scope.isCartVisible;
      };
    });
  </script>
   <script src="/project-folder/assets/js/products.js"></script>
</body>
</html>
