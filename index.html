<!DOCTYPE html>
<html lang="en" ng-app="techGroupApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TGLab Store</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body ng-controller="MainController">

  <header class="site-header">
    <h1 class="store-title">TGLab Store</h1>
    <p class="store-subtitle">Your Best Source for Gaming Products</p>
  </header>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="gamer.html">Gamer</a>
    <a href="products.html">Products</a>
  </nav>

  <main class="container">

 >

    <section class="featured-products">
      <h2 class="section-title">Consoles</h2>

      <div class="product-grid">
        <div class="product" ng-repeat="product in products">
          <img ng-src="{{product.image}}" alt="{{product.name}}" />
          <p class="product-name">{{product.name}}</p>
          <a class="btn btn-primary product-btn" ng-href="{{product.link}}" target="_blank">Buy Now</a>
        </div>
      </div>
    </section>

   
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 TGLab Store. All Rights Reserved.</p>
  </footer>

  <script src="assets/js/app.js"></script>
  <script>
    const app = angular.module('techGroupApp', []);
    app.controller('MainController', function ($scope) {
      const defaultImage = 'assets/images/default.jpg'; // Local image fallback
      $scope.products = [
         // 🎮 Consoles
  { name: 'Xbox Series X', image: defaultImage, link: 'https://amzn.to/3YT81eg', category: 'Consoles' },
  { name: 'PlayStation 5', image: defaultImage, link: 'https://amzn.to/4cYZwEv', category: 'Consoles' },
  { name: 'Nintendo Switch OLED', image: defaultImage, link: 'https://amzn.to/3EMs3Au', category: 'Consoles' },

      ];
    });
  </script>
</body>
</html>
